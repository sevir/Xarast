[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/digiogithub/Xarast"
authors = ["The Xarast contributors"]

# ── Shared dependency versions ───────────────────────────────────────────────
# Every crate references these with `workspace = true`, so a version bump
# happens in exactly one place and `cargo deny` sees a single graph.
[workspace.dependencies]
# Geometry. `kurbo` is the f64 curve library the whole stack (peniko, vello,
# parley) is built around; `i_overlay` supplies polygon booleans with a
# fixed-grid, bit-reproducible mode. Both are `MIT OR Apache-2.0`.
kurbo = "0.13"
i_overlay = "9.0"
bitflags = { version = "2.9", features = ["serde"] }
thiserror = "2.0"
slotmap = { version = "1.0", features = ["serde"] }
smallvec = { version = "1.16", features = ["serde"] }
# Persistent HAMT, used ONLY for history checkpoints (a snapshot *over* the
# arena) and for the arena-vs-persistent benchmark of
# `docs/10-architecture.md` §3.1. MPL-2.0, used unmodified: see deny.toml.
imbl = "7.0"

# DEFLATE for both formats: raw DEFLATE (`windowBits = -15`) and the zlib
# CRC-32 of the `.xar` physical layer, and the `.xarast` container through
# `zip`. `MIT OR Apache-2.0`.
#
# **The workspace's one DEFLATE backend is `zlib-rs`** (pure Rust, `Zlib`
# licence, no C toolchain, no `unsafe` of ours), chosen here and nowhere else
# (XARA-T-0090). flate2 compiles exactly one backend per build and `zlib-rs`
# wins over `miniz_oxide` whenever any crate enables it, so the choice is
# made once for everybody: two backends produce different compressed bytes,
# which would make a "deterministic" `.xarast` differ between binaries. On a
# 56 MB `document.svg` it deflates ~3x faster than `miniz_oxide` at level 6
# (`docs/memory/perf.md`). Its output does not depend on the CPU: the SIMD
# paths (`compare256`, `slide_hash`) compute the same values as the scalar
# ones and the hash function depends only on the level. Pinned by
# `xarast-format/tests/container.rs::deterministic_bytes_are_pinned`.
# Other crates (`png`, `usvg`) may still ask for `rust_backend`; that only
# compiles `miniz_oxide`, it does not select it.
# `runtime_detection` is not optional: without it zlib-rs runs its scalar
# paths, and inflating `.xar` blocks was ~50 % slower than on miniz_oxide
# (ProbeX16 parse 176 ms vs 112 ms). With it the import is at parity, and
# the pinned bytes are the same as the scalar build's.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs", "runtime_detection"] }

# SHA-256: corpus lock verification in tests, `Document::canonical_digest()`
# and content-hash deduplication of bitmap resources. RustCrypto,
# `MIT OR Apache-2.0`.
sha2 = "0.10"

# ── Native `.xarast` format ──────────────────────────────────────────────────
# The ZIP container. 9.0.3 is the first release of the 8.x/9.x line that is not
# yanked (every 8.x and 9.0.0-9.0.2 are). Every default feature is off: the
# container only ever writes
# STORED and DEFLATE (`research/06 §4.2`), and AES, bzip2, lzma, xz, ppmd and
# deflate64 would only widen the attack surface of the reader. `zopfli` is
# left out too: far too slow for an interactive save. `MIT`.
#
# DEFLATE goes through `flate2` on the workspace's one backend, selected on
# the `flate2` line above (`zlib-rs`), never through `zip`'s
# `deflate-flate2-zlib-rs` feature: the backend is a workspace decision, and
# the golden test in `xarast-format/tests/container.rs` fails if it moves.
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2"] }
# The manifest (and, from W3/W4, the SVG profile). 0.41 because it is the
# version already in the graph; `research/06 §13.2` explains why it and not
# a tree parser. `MIT`.
quick-xml = "0.41"
# Content digests and resource identity (`research/06 §4.4`). The default
# `std` feature only; SIMD is detected at run time. `CC0-1.0 OR Apache-2.0`.
blake3 = "1.8"
# Scratch directories in the durability tests. `MIT OR Apache-2.0`.
tempfile = "3.27"

# ── Render engine ────────────────────────────────────────────────────────────
# `vello_cpu` is the coverage rasteriser the Phase 4 W0 spike selected; see
# `docs/memory/render.md` for the measurements. We use it as a rasteriser
# only: the scene, the display list, the paints, the compositor and the blend
# families are ours. `Apache-2.0 OR MIT`.
#
# Features: `std` and `u8_pipeline` are the production path, `f32_pipeline`
# is the higher-precision path used for `RenderQuality::Final` and for the
# golden oracle, `multithreading` gives the band parallelism. `text` and
# `png` are off: glyph rasterisation is Phase 9's and image I/O is Phase 10's.
vello_cpu = { version = "0.2", default-features = false, features = [
    "std",
    "u8_pipeline",
    "f32_pipeline",
    "multithreading",
] }
# The GPU backend, behind the `gpu` feature of `xarast-render`. Never built
# in CI's default job, because CI has no adapter. Both `Apache-2.0 OR MIT`.
# Note: `vello` 0.10 depends on `wgpu` 29, not the 30 below. Only the W0
# spike bench (`xarast-render`'s `spike-gpu` feature) uses it today; R5.1 has
# to reconcile the two before `vello` joins the GPU backend.
vello ={ version = "0.10", default-features = false, features = ["wgpu", "wgpu_default"] }
# Default features on purpose: with none, no backend is compiled in and
# `Instance::new` panics outright rather than reporting no adapter.
wgpu = "30"
# Golden-image encoding and decoding. `MIT OR Apache-2.0`.
png = "0.18"
# Band and tile parallelism. `MIT OR Apache-2.0`.
rayon = "1.12"

# ── Images (`xarast-image`, phase 10) ────────────────────────────────────────
# The decoding façade (`research/05 §6`). Default features are off: no
# `rayon`, no AVIF/EXR/HDR/DDS/QOI/TGA/ICO/farbfeld. Exactly the seven formats
# phase 10 decodes are on: PNG (`png`), JPEG (`zune-jpeg`, the fast decoder
# `research/05 §6` picks, reached through this façade rather than declared a
# second time), WebP (`image-webp`, pure Rust), GIF (`gif`), TIFF (`tiff`),
# BMP and PNM (built in). EXIF orientation and the raw EXIF/ICC blocks come
# from the same decoders, so `kamadak-exif` is not needed for import. Already
# in the graph through `arboard`; the formats enabled here unify into its
# build too. `image` and every codec are `MIT OR Apache-2.0`; zune is
# `MIT OR Apache-2.0 OR Zlib`.
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "tiff",
    "bmp",
    "pnm",
] }

# ── Export encoders (`xarast-io`, phase 11) ─────────────────────────────────
# JPEG export: quality, progressive, chroma subsampling, JFIF density and
# APP1 EXIF (`docs/memory/export.md`). Its `simd` feature stays off: that
# path picks AVX2 at run time, and an export must be byte-identical on every
# machine. `(MIT OR Apache-2.0) AND IJG`: the forward DCT is derived from the
# IJG library, whose only condition on a binary is the acknowledgement kept
# in `docs/11-licensing-and-clean-room.md` §4.1 (justified in `deny.toml`).
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
# WebP export, lossless only: pure Rust, already in the graph through
# `image`. There is no acceptable pure-Rust *lossy* WebP encoder
# (`docs/memory/export.md`). `MIT OR Apache-2.0`.
image-webp = "0.2.4"
# The optional "optimise (slower)" PNG pass, behind `xarast-io`'s `oxipng`
# feature, off by default. `MIT`; its `libdeflater` builds the C library
# libdeflate (`Apache-2.0` crate, MIT upstream), which is why it is not a
# default feature. `parallel` stays off so the trial order, and therefore
# the output, is fixed; `zopfli` and the CLI (`binary`) are not wanted.
oxipng = { version = "10.2", default-features = false }
# PDF export (phase 11 W11.4): the low-level object and content-stream
# writer from the Typst project. Chosen over `krilla`, the high-level writer
# built on it, by the T11.4.1 spike (`docs/memory/export.md`): `krilla`
# cannot carry a baked ramp as a sampled function, has no mesh shadings,
# works in `f32` scene coordinates, pins a second `skrifa` and needs a newer
# `rust-version`. Pure Rust, four small dependencies. `MIT OR Apache-2.0`.
pdf-writer = "0.15"

# ── Application core ─────────────────────────────────────────────────────────
# Insertion-ordered set/map. The selection is an ordered set: "the first
# object selected" and "the last" are both user-visible, and iteration order
# has to be stable or the scene walker's overlay order flickers.
# `MIT OR Apache-2.0`.
indexmap = "2.14"

# Test and benchmark tooling.
proptest = "1.7"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tiny-skia = "0.12"

# ── Text ─────────────────────────────────────────────────────────────────────
# The Linebender text stack chosen in `research/05 §5`, used only inside
# `xarast-text`: nothing else in the workspace may name one of these types.
# `parley` shapes (through `harfrust`) and itemises; `fontique` enumerates the
# system's fonts and supplies script fallback. Both `Apache-2.0 OR MIT`.
# `fontconfig-dlopen` loads libfontconfig at run time instead of linking it,
# like winit's `wayland-dlopen`: the build needs no fontconfig development
# files, and the AppImage uses the host's fontconfig, which it must (a
# bundled one cannot see the user's fonts, `research/05`).
parley = { version = "0.11.1", default-features = false, features = ["std", "system"] }
fontique = { version = "0.11.1", default-features = false, features = [
    "std",
    "system",
    "fontconfig-dlopen",
] }
# Outlines, metrics, charmaps and `OS/2`. Pinned to the exact line `parley`
# 0.11.1 depends on (0.44, not the 0.47 of `research/05`), so the graph holds
# one `skrifa` — `vello` already uses the same one. `MIT OR Apache-2.0`.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# UAX #9 levels and per-line visual reordering. `parley` resolves bidi too but
# does not expose the levels, and our own line breaker needs them. Already in
# the graph (through `usvg`). `MIT OR Apache-2.0`.
unicode-bidi = "0.3.18"
# UAX #14 break opportunities and the Unicode Script property, from ICU4X, the
# same versions `parley` already links. `Unicode-3.0`.
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Font embedding (`xarast-text::embed`: WOFF2 in `.xarast`/SVG, subset fonts
# in PDF). `subsetter` (Typst) subsets TrueType and CFF faces; pure Rust,
# `MIT OR Apache-2.0`, one dependency (`rustc-hash`, already in the graph).
# Default features off: `variable-fonts` would pull a second `skrifa`
# (0.42) and `write-fonts`; a variable face is embedded at its default
# instance or not at all (`docs/memory/text.md`, "Font embedding").
subsetter = { version = "0.2.6", default-features = false }
# The Brotli stream inside WOFF2 (our own encoder, `embed/woff2.rs`). Pure
# Rust, `BSD-3-Clause AND MIT` (both allowed), deterministic single-threaded.
brotli = { version = "9", default-features = false, features = ["std"] }

# ── User interface ───────────────────────────────────────────────────────────
# `egui` used as a *library*, never through `eframe` (`research/05 §2.4`): the
# shell owns winit and wgpu, so the canvas and the panels share one surface.
# The version is 0.33 rather than the 0.36 of `research/05 §2.2` because 0.36
# declares `rust-version = 1.95` while this workspace pins stable 1.94 and
# `rust-version = 1.90`; bumping both is the only thing the upgrade needs.
# `MIT OR Apache-2.0`.
egui = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "accesskit",
    "serde",
] }
# `TableBuilder`, the virtualised backing of the layer tree and the galleries.
egui_extras = { version = "0.33", default-features = false }
# Docking: nestable tab/linear/grid containers with a serialisable tree.
# `MIT OR Apache-2.0`.
egui_tiles = { version = "0.14", default-features = false, features = ["serde"] }
# Headless widget testing over the AccessKit tree (kittest). The `wgpu` and
# `snapshot` features are deliberately off: CI has no adapter.
egui_kittest = { version = "0.33", default-features = false }
# Accessibility tree types. Pinned to the version `egui 0.33` itself
# depends on, so the dependency graph holds exactly one AccessKit and a
# node built here is the same type egui publishes — `xarast-ui` reaches it
# through `egui::accesskit` rather than depending on it directly.
#
# This version has to agree with whatever `accesskit_winit` the shell
# picks: the adapter carries egui's tree to AT-SPI, and a mismatched major
# puts two AccessKits in the graph and two incompatible `TreeUpdate`
# types at the boundary. `MIT OR Apache-2.0`.
accesskit = "0.21"
# Layout and preference persistence. Both `MIT OR Apache-2.0`.
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

# ── Shell and platform integration ───────────────────────────────────────────
# `winit` is pinned at the 0.30 stable line, not the 0.31 beta. The evaluation
# that decided it (E1–E7 of `docs/phases/phase-05-shell-and-ui.md`, plus the
# static evidence that could be gathered without a compositor) is recorded in
# `docs/memory/ui.md`; the short version is that 0.31 is the only route to
# upstream stylus pressure but `accesskit_winit` still pins 0.30.13 and none of
# the seven runtime criteria can be executed yet. `wayland-dlopen` is not
# optional: the AppImage must start on a host with no Wayland development
# libraries (`docs/memory/packaging.md` invariant 3). Apache-2.0.
winit = { version = "0.30", default-features = false, features = [
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita",
    "x11",
    "rwh_06",
] }
# `StreamExt` for the settings portal's change signal, on the services
# thread. Already in the graph through `async-io`. `MIT OR Apache-2.0`.
futures-lite = { version = "2", default-features = false, features = ["std"] }
# The AccessKit platform adapter: carries egui's accessibility tree to AT-SPI
# on Linux (and UIA/NSAccessibility in phase 14). 0.29.x is the release line
# built on `accesskit 0.21`, the version `egui 0.33` publishes; 0.34 pairs
# with 0.25 and would put two incompatible `TreeUpdate` types at the
# shell/UI boundary (`docs/memory/ui.md`). `async-io`, not `tokio`: no
# runtime reaches the core. `MIT OR Apache-2.0`.
accesskit_winit = { version = "0.29.2", default-features = false, features = [
    "accesskit_unix",
    "async-io",
    "rwh_06",
] }
# Blocking adaptor for the handful of `wgpu` futures the shell awaits during
# start-up. No async runtime reaches the core (`research/05 §10.1`).
# `MIT OR Apache-2.0`.
pollster = "1.0"
# Structured logging. Both `MIT`.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# XDG desktop portals. On Linux the shell talks to the portal directly with
# `ashpd`: the file chooser (`org.freedesktop.portal.FileChooser`) and the
# settings portal (`org.freedesktop.appearance`). `rfd` is not used there:
# measured on GNOME 46 (`docs/memory/ui.md`), its portal backend turns every
# portal failure into "cancelled" and then spawns `zenity` as a fallback, so a
# missing portal could never be reported. `rfd` stays declared for the native
# Windows and macOS dialogs of phase 14, where no crate uses it yet.
# `async-io` rather than `tokio`: the services thread runs a single blocking
# executor and no async leaks past it. Both MIT.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
ashpd = { version = "0.13", default-features = false, features = [
    "async-io",
    "file_chooser",
    "settings",
] }
# SIGINT/SIGTERM/SIGHUP in the shell (XARA-T-0086): a safe iterator over
# signals on its own thread, so the binary needs no `unsafe` of its own to
# autosave and release document locks. Its registry crate is already in the
# graph (through zbus). MIT OR Apache-2.0.
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
# Wayland drag and drop. `winit` 0.30 implements no drag-and-drop at all on
# Wayland (only X11 has `HoveredFile`/`DroppedFile`; measured on GNOME 46), so
# the shell binds `wl_data_device` itself, on `winit`'s own connection. These
# are the versions `winit` already links, so no new code enters the graph;
# `client_system` is what lets a second event queue share `winit`'s
# `wl_display`, and `winit`'s `wayland-dlopen` keeps libwayland-client
# dlopen'ed. All `MIT`; raw-window-handle is `MIT OR Apache-2.0 OR Zlib`.
smithay-client-toolkit = { version = "0.19.2", default-features = false }
wayland-client = "0.31.10"
wayland-backend = { version = "0.3.10", default-features = false, features = [
    "client_system",
] }
raw-window-handle = "0.6"
# `xdg-foreign-unstable-v2`, to export the window's surface so a portal
# dialog can be stacked on it (XARA-T-0048). Already in the graph through
# `smithay-client-toolkit` with these features. `MIT`.
wayland-protocols = { version = "0.32.13", default-features = false, features = [
    "client",
    "unstable",
] }
# Clipboard. `wayland-data-control` gives copy/paste that survives focus loss
# where the compositor implements `wlr-data-control`. `MIT OR Apache-2.0`.
arboard = { version = "3.6", default-features = false, features = [
    "image-data",
    "wayland-data-control",
] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# Fast iteration on a large workspace: optimise dependencies even in dev so that
# rasterising a real document in a debug build stays interactive.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
# Unwinding, not aborting. cargo-fuzz needs it to catch a panic as a finding
# rather than losing the process, and the .xar importer is fuzzed from day one.
panic = "unwind"

# Used by the golden-image and corpus tests, which are unbearably slow otherwise.
[profile.test]
opt-level = 2
