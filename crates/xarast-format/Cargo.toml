[package]
name = "xarast-format"
description = "Reader and writer for the native .xarast container format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The container, the manifest, the resource index and the durability layer
# know nothing about the document model: they move bytes. The SVG profile
# (W3/W4, next round) is the only part that will reach for `xarast-doc`, and
# it plugs in through `PackageWriter::set_document` / `XarastReader::entry`.
[dependencies]
xarast-doc = { path = "../xarast-doc" }
xarast-geom = { path = "../xarast-geom" }
xarast-color = { path = "../xarast-color" }
# The clouds and plasma generators, for the baked base of a procedural
# fill (phase 13 H8).
xarast-image = { path = "../xarast-image" }
zip = { workspace = true }
quick-xml = { workspace = true }
blake3 = { workspace = true }
# The escape heuristic of `research/06 §4.3` deflates a 64 KiB sample. This
# is also the dependency that gives `zip` its DEFLATE backend (`zlib-rs`,
# chosen once in the workspace manifest).
flate2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The corpus sweep of the SVG writer imports `.xar` files.
xarast-xar = { path = "../xarast-xar" }
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "container"
harness = false
