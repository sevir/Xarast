[package]
name = "xarast-text"
description = "Font handling, shaping and text layout for Xarast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["complex-scripts"]
# Dictionary-based line breaking for Thai, Lao, Khmer and Myanmar, in both our
# line breaker and parley's. Phase 9 requires it; it costs binary size (the
# ICU4X dictionaries), measured in `docs/memory/perf.md`.
complex-scripts = ["parley/complex-scripts"]

[dependencies]
xarast-geom = { path = "../xarast-geom" }
xarast-unwind = { path = "../xarast-unwind" }
kurbo = { workspace = true }
parley = { workspace = true }
fontique = { workspace = true }
skrifa = { workspace = true }
unicode-bidi = { workspace = true }
icu_segmenter = { workspace = true }
icu_properties = { workspace = true }
subsetter = { workspace = true }
brotli = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "layout"
harness = false
