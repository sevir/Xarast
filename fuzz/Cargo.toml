[package]
name = "xarast-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

# Its own workspace: `cargo fuzz` needs nightly and a `-Z build-std`-ish
# profile, and the main workspace must stay buildable on stable.
[workspace]
members = []

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
xarast-xar = { path = "../crates/xarast-xar" }
xarast-geom = { path = "../crates/xarast-geom" }
xarast-doc = { path = "../crates/xarast-doc" }
xarast-render = { path = "../crates/xarast-render" }
xarast-color = { path = "../crates/xarast-color" }
xarast-format = { path = "../crates/xarast-format" }
xarast-image = { path = "../crates/xarast-image" }
arbitrary = { version = "1", features = ["derive"] }
# Only to forge dangling resource keys for `fuzz_doc_builder`.
slotmap = "1.0"
# The journal's base is JSON (`fuzz_journal_read`).
serde_json = "1.0"

[profile.release]
debug = 1
# Unwinding, not aborting: cargo-fuzz reports a panic as a finding rather
# than losing the process, which is the whole point of invariant 1.
panic = "unwind"

# The physical layer: magic, framing, the deflate state machine, the CRC
# trailer reposition. The highest-value target — this is where the pointer
# arithmetic and the length handling live.
[[bin]]
name = "fuzz_xar_records"
path = "fuzz_targets/fuzz_xar_records.rs"
test = false
doc = false
bench = false

# DOWN/UP imbalance, atomic subtree stripping, deep nesting, numbering.
[[bin]]
name = "fuzz_xar_tree"
path = "fuzz_targets/fuzz_xar_tree.rs"
test = false
doc = false
bench = false

# The whole pipeline into `DocumentBuilder`: "valid or nothing".
[[bin]]
name = "fuzz_xar_import"
path = "fuzz_targets/fuzz_xar_import.rs"
test = false
doc = false
bench = false

# Every typed decoder, over the tree an arbitrary file produces.
[[bin]]
name = "fuzz_xar_decode"
path = "fuzz_targets/fuzz_xar_decode.rs"
test = false
doc = false
bench = false

# The `% 9` check, the interleave, the delta sign, the extent clamp.
[[bin]]
name = "fuzz_xar_path"
path = "fuzz_targets/fuzz_xar_path.rs"
test = false
doc = false
bench = false

# Inherit sentinels, parent chains, the depth limit.
[[bin]]
name = "fuzz_xar_colour"
path = "fuzz_targets/fuzz_xar_colour.rs"
test = false
doc = false
bench = false

# Two arbitrary paths through every BoolOp x FillRule, and self_union.
[[bin]]
name = "fuzz_path_boolean"
path = "fuzz_targets/fuzz_path_boolean.rs"
test = false
doc = false
bench = false

# SVG path data as arbitrary text, and the exact integer round trip.
[[bin]]
name = "fuzz_svg_path_parse"
path = "fuzz_targets/fuzz_svg_path_parse.rs"
test = false
doc = false
bench = false

# Arbitrary scenes through DisplayList::build and the CPU backend.
[[bin]]
name = "fuzz_display_list"
path = "fuzz_targets/fuzz_display_list.rs"
test = false
doc = false
bench = false

# Ramp tables, profiles and gradient evaluation.
[[bin]]
name = "fuzz_ramp"
path = "fuzz_targets/fuzz_ramp.rs"
test = false
doc = false
bench = false

# Arbitrary build scripts through DocumentBuilder: "valid or nothing".
[[bin]]
name = "fuzz_doc_builder"
path = "fuzz_targets/fuzz_doc_builder.rs"
test = false
doc = false
bench = false

# The `.xarast` container: signature, end record, central directory, names,
# limits, the manifest, every read path, and a full re-save of whatever opens.
[[bin]]
name = "fuzz_xarast_open"
path = "fuzz_targets/fuzz_xarast_open.rs"
test = false
doc = false
bench = false

# The operation journal's line reader, its base reader and replay (F6.6):
# never panic, and a refused entry changes nothing.
[[bin]]
name = "fuzz_journal_read"
path = "fuzz_targets/fuzz_journal_read.rs"
test = false
doc = false
bench = false

# `repair` (local-header scan, rebuild), the recovering open and the partial
# XML closer: a rebuilt package must open strictly.
[[bin]]
name = "fuzz_xarast_repair"
path = "fuzz_targets/fuzz_xarast_repair.rs"
test = false
doc = false
bench = false

# `META-INF/manifest.xml`: hostile XML, namespaces, foreign-data carry, and
# the write–parse fixed point.
[[bin]]
name = "fuzz_xarast_manifest"
path = "fuzz_targets/fuzz_xarast_manifest.rs"
test = false
doc = false
bench = false

# The SVG profile reader: hostile XML, CSS, path data, paint servers,
# foreign data; and the read–save–read fixed point of what it accepts.
[[bin]]
name = "fuzz_xarast_svg_read"
path = "fuzz_targets/fuzz_xarast_svg_read.rs"

# Every image format through the `xarast-image` facade with tight limits,
# and the legacy `.xar` bitmap wrappings (headerless DIB, BMPZIP, the 8 bpp
# JPEG palette).
[[bin]]
name = "fuzz_image_decode"
path = "fuzz_targets/fuzz_image_decode.rs"

# hit_fill / hit_stroke on arbitrary geometry, transforms and styles, and
# HitIndex edit sequences against a brute-force list.
[[bin]]
name = "fuzz_hit_test"
path = "fuzz_targets/fuzz_hit_test.rs"
test = false
doc = false
bench = false
